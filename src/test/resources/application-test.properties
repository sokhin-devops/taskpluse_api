# ---------------------------------------------------------------------------
# TaskPulse API - test configuration
#
# The suite runs against in-memory H2 so that `mvn test` needs no Postgres and
# never touches the developer's taskpluse_db.
#
# H2 runs in PostgreSQL compatibility mode on purpose: the entities use a few
# Postgres spellings (the TEXT column type, and `default '...'` inside a
# columnDefinition), and plain H2 would reject them. Compatibility mode keeps the
# schema Hibernate generates here the same shape as the real one.
# ---------------------------------------------------------------------------

spring.datasource.url=jdbc:h2:mem:taskpulse;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# Long enough to satisfy the HS256 key-length check in JwtService.
app.jwt.secret=test-secret-key-for-taskpulse-unit-tests-0123456789
app.jwt.expiration-minutes=60

# Tests create whatever accounts they need; a seeded demo account would only
# make assertions about "how many users exist" ambiguous.
app.seed.demo-user=false

app.cors.allowed-origins=http://localhost:4200
