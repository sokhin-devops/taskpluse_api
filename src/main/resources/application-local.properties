# ---------------------------------------------------------------------------
# TaskPulse API - local development
#
# The active profile when nothing says otherwise, so `mvn spring-boot:run` and the
# IDE's green arrow both land here without any extra flags.
#
# Every value below is a convenience for one developer machine. None of it is a
# secret worth protecting, which is why it can sit in the repository: the database
# is on localhost and the JWT key signs nothing anyone else will ever see.
# ---------------------------------------------------------------------------

# Datasource (PostgreSQL) - database name spelling is intentional
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/taskpluse_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:underadmin}
spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate keeps the local schema in step with the entities as they change.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# A fixed development key, so a restart does not invalidate the token in your browser.
app.jwt.secret=${APP_JWT_SECRET:change-me-taskpulse-local-dev-secret-key-0123456789}

# Gives an empty database something to log in with.
app.seed.demo-user=true

# CORS - `ng serve` proxies /api through localhost:4200, but a direct call from the
# browser console or a second dev port still needs the origin listed here.
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:4200,http://127.0.0.1:4200}
