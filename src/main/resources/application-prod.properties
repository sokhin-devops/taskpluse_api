# ---------------------------------------------------------------------------
# TaskPulse API - production (https://taskpluse-api.sokhin.site)
#
# Nothing here is a literal credential. Every sensitive value is read from an
# environment variable with no fallback, so a missing one stops the application at
# start-up with a clear message rather than silently running on a development
# default - a container that boots with the local JWT key would accept tokens
# minted by anyone who has read this repository.
#
# Required: DB_URL, DB_USERNAME, DB_PASSWORD, APP_JWT_SECRET
# ---------------------------------------------------------------------------

# Datasource (PostgreSQL)
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# A pool sized for a single small instance; raise it when the API is scaled out.
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:10}

# `update` still lets Hibernate add new columns on deploy, which is what this
# project relies on for migrations. Once the schema settles, switch to `validate`
# via SPRING_JPA_DDL_AUTO so a rename can never silently reshape live data.
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_DDL_AUTO:update}
spring.jpa.show-sql=false

# Security / JWT - no default: the container must be given a real key.
app.jwt.secret=${APP_JWT_SECRET}

# Never seed a demo account on a public deployment: demo@taskpulse.dev with a
# published password would be a working login for anyone who read this file.
app.seed.demo-user=false

# CORS - the web application is served from its own origin, so the browser needs
# this to be exact, scheme included.
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:https://taskpluse-web.sokhin.site}

# Behind a reverse proxy (nginx, Traefik, Cloudflare) terminating TLS. Without this
# Spring builds redirect and Location headers from the internal http://host:8082
# rather than the public https:// URL.
server.forward-headers-strategy=${SERVER_FORWARD_HEADERS_STRATEGY:framework}

# Swagger UI stays reachable so the deployed API is explorable. Set
# SPRINGDOC_ENABLED=false to take both it and /v3/api-docs off the public internet.
springdoc.api-docs.enabled=${SPRINGDOC_ENABLED:true}
springdoc.swagger-ui.enabled=${SPRINGDOC_ENABLED:true}

# Quieter logs, and no stack traces or internal messages in API error responses.
logging.level.root=INFO
logging.level.com.taskpulse=INFO
server.error.include-message=never
server.error.include-stacktrace=never
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
