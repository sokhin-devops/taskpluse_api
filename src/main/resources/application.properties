# ---------------------------------------------------------------------------
# TaskPulse API - application configuration
# ---------------------------------------------------------------------------

# Application
spring.application.name=taskpulse_api
server.port=8082

# Datasource (PostgreSQL) - database name spelling is intentional
spring.datasource.url=jdbc:postgresql://localhost:5432/taskpluse_db
spring.datasource.username=postgres
spring.datasource.password=underadmin
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate - the entity is the schema
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Security / JWT
# The secret must be at least 32 characters (HS256 needs 256 bits of key material).
# Override it with the APP_JWT_SECRET environment variable outside local development.
app.jwt.secret=${APP_JWT_SECRET:change-me-taskpulse-local-dev-secret-key-0123456789}
app.jwt.expiration-minutes=720

# Demo account, created only when the accounts table is empty. It also adopts any task
# that predates accounts, so an existing database is not orphaned by the upgrade.
# Turn this off anywhere other than your own machine.
app.seed.demo-user=true
app.seed.demo-email=demo@taskpulse.dev
app.seed.demo-password=taskpulse123
app.seed.demo-name=Demo User

# springdoc / Swagger UI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha

# CORS - comma-separated list of allowed origins for /api/**
app.cors.allowed-origins=http://localhost:4200
