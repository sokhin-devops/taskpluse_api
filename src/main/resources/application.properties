# ---------------------------------------------------------------------------
# TaskPulse API - application configuration
# ---------------------------------------------------------------------------

# Application
spring.application.name=taskpulse_api
server.port=8082

# Datasource (PostgreSQL) - database name spelling is intentional
spring.datasource.url=jdbc:postgresql://localhost:5432/taskpluse_db
spring.datasource.username=postgres
spring.datasource.password=underadmin
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate - the entity is the schema
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# springdoc / Swagger UI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha

# CORS - comma-separated list of allowed origins for /api/**
app.cors.allowed-origins=http://localhost:4200
