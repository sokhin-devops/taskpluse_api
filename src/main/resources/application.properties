# ---------------------------------------------------------------------------
# TaskPulse API - shared configuration
#
# This file holds only what is true in every environment. Anything that differs
# between a laptop and the server lives in application-local.properties or
# application-prod.properties, and the active profile decides which one is layered
# on top of this.
#
#   local  (default)  jdbc to localhost, demo seed on, CORS for ng serve
#   prod              everything from environment variables, no seed
#   test              in-memory H2, set by @ActiveProfiles in the suite
#
# Pick one with SPRING_PROFILES_ACTIVE=prod, or -Dspring.profiles.active=prod.
# ---------------------------------------------------------------------------

# Application
spring.application.name=taskpulse_api
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}
server.port=${SERVER_PORT:8082}

# JPA / Hibernate - the entity is the schema
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

# Security / JWT
# The secret must be at least 32 characters (HS256 needs 256 bits of key material).
# There is no default here on purpose: each profile decides whether a throwaway
# development key is acceptable, and prod requires the variable to be set.
app.jwt.expiration-minutes=${APP_JWT_EXPIRATION_MINUTES:720}

# Demo account, created only when the accounts table is empty. It also adopts any task
# that predates accounts, so an existing database is not orphaned by the upgrade.
# Whether it runs at all is a per-profile decision; these are just its details.
app.seed.demo-email=demo@taskpulse.dev
app.seed.demo-password=taskpulse123
app.seed.demo-name=Demo User

# springdoc / Swagger UI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
